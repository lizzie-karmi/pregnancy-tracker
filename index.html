<style>
:root {
  --rose:#e85d75; --rose-light:#fdf0f3; --rose-mid:#fce4ea;
  --emerald:#2e9e6b; --slate-gray:#94a3b8;
  --s100:#f1f5f9; --s200:#e2e8f0; --s300:#cbd5e1; --s400:#94a3b8;
  --s500:#64748b; --s600:#475569; --s700:#334155; --s800:#1e293b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Heebo',sans-serif;background:var(--rose-light);color:var(--s800);min-height:100vh;padding-bottom:env(safe-area-inset-bottom,20px)}
.hdr{background:white;border-bottom:1px solid var(--rose-mid);padding:20px 16px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(232,93,117,.08)}
.hdr-eye{font-size:10px;color:var(--rose);font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.hdr-title{font-size:22px;font-weight:700}
.hdr-sub{font-size:12px;color:var(--s400);margin-top:2px}
.legend{padding:12px 16px 4px;display:flex;flex-wrap:wrap;gap:6px;max-width:600px;margin:0 auto}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:500}
.bC{background:#dcfce7;color:#166534}.bMM{background:#e0f2fe;color:#075985}.bM{background:#dbeafe;color:#1e40af}
.bA{background:#fef3c7;color:#92400e}.bZ{background:#ffedd5;color:#9a3412}.bD{background:#fee2e2;color:#991b1b}
.vK{background:#f0fdf4;color:#166534;border:1px solid #86efac}
.vP{background:#faf5ff;color:#6b21a8;border:1px solid #d8b4fe}
.vB{background:#eff6ff;color:#1e40af;border:1px solid #93c5fd}
.tabs-wrap{padding:12px 16px;max-width:600px;margin:0 auto}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:8px 12px;border-radius:12px;font-size:13px;font-weight:500;border:1.5px solid var(--s200);background:white;color:var(--s600);cursor:pointer;display:flex;align-items:center;gap:4px;font-family:'Heebo',sans-serif}
.tab.on{background:var(--rose);border-color:var(--rose);color:white}
.tbadge{font-size:10px;padding:1px 5px;border-radius:10px;font-weight:700}
.tab.on .tbadge{background:rgba(255,255,255,.3);color:white}
.tab:not(.on) .tbadge{background:#dcfce7;color:#166534}
.content{max-width:600px;margin:0 auto;padding:0 16px 32px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{font-size:15px;font-weight:600;color:var(--s700)}
.sec-sub{font-size:11px;color:var(--s400);margin-top:1px}
.prog{font-size:11px;color:var(--s500);background:white;border:1px solid var(--s200);border-radius:20px;padding:3px 10px;white-space:nowrap}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:white;border:1.5px solid var(--s200);border-radius:14px;overflow:hidden}
.card.urgent{border-color:#fca5a5}
.card.done{border-color:#bbf7d0;opacity:.65}
.card.skip{border-color:var(--s300);opacity:.5}
.card-head{padding:14px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;user-select:none}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--s400);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;cursor:pointer;background:white;font-size:12px}
.chk.done{background:var(--emerald);border-color:var(--emerald)}
.chk.skip{background:var(--slate-gray);border-color:var(--slate-gray)}
.chk-done-ico,.chk-skip-ico{display:none}
.chk.done .chk-done-ico{display:block}
.chk.skip .chk-skip-ico{display:block;color:white;font-weight:700;line-height:1}
.card-body{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:4px}
.card.done .card-name{text-decoration:line-through;color:var(--s400)}
.card.skip .card-name{text-decoration:line-through;color:var(--s400)}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.card-weeks{font-size:11px;color:var(--s500)}
.card-dr{font-size:11px;font-weight:600;color:var(--rose);margin-top:2px}
.card-appt{font-size:11px;font-weight:600;color:var(--emerald);margin-top:2px}
.card-skip-lbl{font-size:11px;font-weight:600;color:var(--slate-gray);margin-top:2px}
.card-chev{color:var(--s300);font-size:11px;margin-top:3px;flex-shrink:0}
.card-exp{display:none;padding:12px 14px 14px;border-top:1px solid var(--s100)}
.card.open .card-exp{display:block}
.card-det{font-size:13px;color:var(--s700);line-height:1.6;margin-bottom:12px}
.appt-block{background:var(--s100);border:1px solid var(--s200);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.appt-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.appt-lbl{font-size:12px;color:var(--s500);font-weight:500}
.appt-val{font-size:12px;font-weight:600;color:var(--emerald);flex:1}
.appt-clear{font-size:12px;color:var(--s400);background:none;border:none;cursor:pointer;font-family:'Heebo',sans-serif;padding:0}
.appt-input{display:block;width:100%;max-width:100%;box-sizing:border-box;min-height:42px;line-height:24px;font-size:14px;border:1.5px solid var(--s300);border-radius:8px;padding:8px 10px;background:white;font-family:'Heebo',sans-serif;color:var(--s700);outline:none;direction:ltr;-webkit-appearance:none;appearance:none}
.appt-input:focus{border-color:var(--rose)}
.status-row{display:flex;gap:6px;margin-bottom:12px}
.status-btn{flex:1;font-size:12px;padding:7px 4px;border-radius:8px;border:1.5px solid var(--s200);background:white;color:var(--s500);cursor:pointer;font-family:'Heebo',sans-serif;font-weight:500}
.status-btn.on-done{background:var(--emerald);border-color:var(--emerald);color:white}
.status-btn.on-skip{background:var(--slate-gray);border-color:var(--slate-gray);color:white}
.status-btn.on-plan{background:var(--rose);border-color:var(--rose);color:white}
.meta-row{display:flex;flex-wrap:wrap;gap:16px}
.meta-lbl{font-size:10px;color:var(--s400);margin-bottom:2px}
.meta-val{font-size:12px;font-weight:500;color:var(--s600)}
.foot-note{background:white;border:1px solid var(--rose-mid);border-radius:14px;padding:14px;margin-top:20px;font-size:12px;color:var(--s500);line-height:1.6}
</style>

  {id:"priv_genetic",name:"ייעוץ גנטי",when:"לפי ממצאי הסקרים",dr:"לפי ממצאים",venue:"B",cost:"כללית בהפניה: כלול | פרטי ₪500–₪1,000",det:"בעקבות ממצא חריג בסקר. ניתן לקבל הפניה מד\"ר בוצ'ן."},
  {id:"priv_privob",name:"ביקורי רופא נשים פרטי",when:"לאורך ההריון",dr:"לפי בחירה",venue:"P",cost:"₪400–₪700/ביקור | החזר חלקי מושלם",det:"מעקב אישי, זמינות גבוהה, ליווי עד לידה."},
  {id:"priv_course",name:"קורס הכנה ללידה",when:"שליש שלישי",dr:"נובמבר–ינואר 2027",venue:"B",cost:"₪800–₪2,500 | החזר חלקי מושלם",det:"סדנאות זוגיות, שיטות להפגת כאב, הנקה."},
  {id:"priv_doula",name:"דולה / ליווי לידה",when:"לידה",dr:"פברואר 2027",venue:"P",cost:"₪2,000–₪5,000 | ייתכן החזר חלקי פלטינום",det:"תמיכה אישית רצופה בלידה."},
  {id:"priv_cordblood",name:"שימור דם טבורי",when:"לידה – לסגור מראש",dr:"לפני הלידה",venue:"P",cost:"₪3,000–₪5,000 + ₪500–₪1,000/שנה",det:"אחסון תאי גזע מדם חבל הטבור. שנוי במחלוקת רפואית."}
]
};

var TAG={C:"bC",MM:"bMM",M:"bM",A:"bA",Z:"bZ"};
var TAGL={C:"חובה",MM:"מומלץ מאוד",M:"מומלץ",A:"לפי אינדיקציה",Z:"לפי צורך"};
var VENUE={K:"vK",B:"vB",P:"vP"};
var VENUEL={K:"כללית",B:"כללית + פרטי",P:"פרטי בלבד"};
var FOOT={
  t1:"🫐 שליש ראשון: שבוע 6 = אוכמנייה (~6מ\"מ). שבוע 13 = שזיף קטן (~7–8 ס\"מ).",
  t2:"🍑 שליש שני: שבוע 14 = לימון. שבוע 20 = אפרסק (~25 ס\"מ, ~300 גרם). שבוע 27 = חצילון (~36 ס\"מ, ~900 גרם).",
  t3:"🍉 שליש שלישי: שבוע 28 = אנגוריה (~37 ס\"מ, ~1 ק\"ג). שבוע 36 = ~47 ס\"מ, ~2.6 ק\"ג. שבוע 38–39 = ~3–3.5 ק\"ג.",
  pre:"💡 כללית מושלם/פלטינום: החזר 75% על בדיקות פרטיות עד תקרה של ~₪2,248 להריון.",
  priv:"💡 שמרי קבלה מקורית + סיכום רפואי לכל בדיקה פרטית להגשת החזר דרך מושלם."
};

// status: "" (none) | "done" | "skip"
var state = {};

// -------- One-time migration from old index-based preg-v3 --------
// Old order per section is preserved in OLD_ORDER so we can map index->id.
var OLD_ORDER = {
  pre:["pre_genetic"],
  t1:["t1_visit1","t1_us1","t1_blood1","t1_us2","t1_nt","t1_nipt","t1_cvs"],
  t2:["t2_scan_early","t2_afp","t2_gct","t2_scan_late","t2_echo","t2_amnio","t2_gtt","t2_cbc"],
  t3:["t3_visits","t3_growth","t3_gbs","t3_anesthesia","t3_ctg","t3_csection"],
  priv:["priv_diet","priv_genetic","priv_privob","priv_course","priv_doula","priv_cordblood"]
};

function migrateFromV3() {
  var old = null;
  try { var raw = localStorage.getItem("preg-v3"); if (raw) old = JSON.parse(raw); } catch(e) {}
  if (!old) return false;
  // old keys look like "t1-0": {checked:bool, appt:""}
  for (var k in old) {
    if (!old.hasOwnProperty(k)) continue;
    var parts = k.split("-");
    var sec = parts[0];
    var idx = parseInt(parts[1], 10);
    var order = OLD_ORDER[sec];
    if (!order || isNaN(idx) || idx >= order.length) continue;
    var id = order[idx];
    var o = old[k] || {};
    state[id] = {status: o.checked ? "done" : "", appt: o.appt || ""};
  }
  return true;
}

// Explicit overrides requested by user (applied once on migration)
function applyUserOverrides() {
  function set(id, status, appt) {
    var cur = state[id] || {status:"", appt:""};
    state[id] = {status: status, appt: (appt !== undefined ? appt : cur.appt)};
  }
  // Done, no appointment
  set("t1_visit1","done","");
  set("t1_us1","done","");
  set("t1_blood1","done","");
  // Done with appointments (kept from migration if present, else set)
  if (!state["t1_us2"] || !state["t1_us2"].appt) set("t1_us2","done","2026-07-06T11:50");
  else state["t1_us2"].status="done";
  if (!state["t1_nt"] || !state["t1_nt"].appt) set("t1_nt","done","2026-07-30T09:00");
  else state["t1_nt"].status="done";
  // Not relevant
  set("t1_nipt","skip","");
  set("t1_cvs","skip","");
  // T2 appointments
  if (!state["t2_scan_early"] || !state["t2_scan_early"].appt) set("t2_scan_early","",  "2026-08-25T17:30");
  if (!state["t2_afp"] || !state["t2_afp"].appt) set("t2_afp","", "2026-09-01T08:10");
  if (!state["t2_amnio"] || !state["t2_amnio"].appt) set("t2_amnio","", "2026-09-06T11:30");
  // Dentist current appt
  set("t2_dentist","", "2026-10-21T00:00");
}

function loadState() {
  var v4 = null;
  try { var raw = localStorage.getItem("preg-v4"); if (raw) v4 = JSON.parse(raw); } catch(e) {}
  if (v4) {
    state = v4;
    return;
  }
  // First run on new version: migrate + overrides
  migrateFromV3();
  applyUserOverrides();
  saveState();
}

function saveState() {
  try { localStorage.setItem("preg-v4", JSON.stringify(state)); } catch(e) {}
}
function getItem(id) { return state[id] || {status:"", appt:""}; }
function setStatus(id, status) {
  var it = getItem(id);
  state[id] = {status: status, appt: it.appt || ""};
  saveState();
}
function setAppt(id, val) {
  var it = getItem(id);
  state[id] = {status: it.status || "", appt: val};
  saveState();
}
function cycleStatus(id) {
  var cur = getItem(id).status;
  var next = cur === "" ? "done" : (cur === "done" ? "skip" : "");
  setStatus(id, next);
}
function doneCount(sec) {
  var t = TESTS[sec] || [];
  var n = 0;
  for (var i = 0; i < t.length; i++) { if (getItem(t[i].id).status === "done") n++; }
  return n;
}
function relevantCount(sec) {
  var t = TESTS[sec] || [];
  var n = 0;
  for (var i = 0; i < t.length; i++) { if (getItem(t[i].id).status !== "skip") n++; }
  return n;
}
function hasUnhandled(sec) {
  // returns true if any test is still "" (not done, not skip)
  var t = TESTS[sec] || [];
  for (var i = 0; i < t.length; i++) { if (getItem(t[i].id).status === "") return true; }
  return false;
}

function fmtDate(val) {
  if (!val) return "";
  var parts = val.split("T");
  var dp = parts[0].split("-");
  if (dp.length < 3) return "";
  var out = dp[2] + "/" + dp[1] + "/" + dp[0].slice(2);
  if (parts.length > 1 && parts[1]) {
    var tp = parts[1].split(":");
    // hide midnight 00:00 (used as date-only marker)
    if (!(tp[0] === "00" && tp[1] === "00")) out += " " + tp[0] + ":" + tp[1];
  }
  return out;
}

var activeTab = null;

function pickInitialTab() {
  // Load the first trimester/section (in order) that still has unhandled tests.
  var order = ["t1","t2","t3","pre","priv"];
  for (var i = 0; i < order.length; i++) {
    if (hasUnhandled(order[i])) return order[i];
  }
  return "t1";
}

function renderTabs() {
  var html = "";
  for (var s = 0; s < SECTIONS.length; s++) {
    var sec = SECTIONS[s];
    var done = doneCount(sec.key);
    var rel = relevantCount(sec.key);
    var badge = done > 0 ? '<span class="tbadge">' + done + "/" + rel + "</span>" : "";
    var cls = activeTab === sec.key ? " on" : "";
    html += '<button class="tab' + cls + '" onclick="switchTab(\'' + sec.key + '\')">' + sec.emoji + " " + sec.label + badge + "</button>";
  }
  document.getElementById("tabs").innerHTML = html;
}

function renderContent() {
  var sec = null;
  for (var s = 0; s < SECTIONS.length; s++) { if (SECTIONS[s].key === activeTab) { sec = SECTIONS[s]; break; } }
  var tests = TESTS[activeTab] || [];
  var isPriv = activeTab === "priv";
  var done = doneCount(activeTab);
  var rel = relevantCount(activeTab);
  var html = "";

  html += '<div class="sec-hdr"><div><div class="sec-title">' + sec.emoji + " " + sec.label + "</div>";
  html += '<div class="sec-sub">' + sec.sub + "</div></div>";
  html += '<div class="prog">' + done + "/" + rel + " בוצע</div></div>";
  html += '<div class="cards">';

  for (var i = 0; i < tests.length; i++) {
    var t = tests[i];
    var item = getItem(t.id);
    var st = item.status;
    var cls = "card";
    if (st === "done") cls += " done";
    else if (st === "skip") cls += " skip";
    else if (t.urgent) cls += " urgent";

    var tags = "";
    if (t.tag) tags += '<span class="badge ' + TAG[t.tag] + '">' + TAGL[t.tag] + "</span>";
    if (t.venue) tags += '<span class="badge ' + VENUE[t.venue] + '">' + VENUEL[t.venue] + "</span>";
    if (t.urgent && st === "") tags += '<span class="badge bD">⚡ דחוף</span>';

    var apptMini = (item.appt && st !== "skip") ? '<div class="card-appt">🗓 תור: ' + fmtDate(item.appt) + "</div>" : "";
    var skipMini = st === "skip" ? '<div class="card-skip-lbl">🚫 לא רלוונטי</div>' : "";
    var weeksLine = isPriv ? (t.when || "") : (t.weeks || "");
    var drLine = t.dr ? '<div class="card-dr">📅 ' + t.dr + "</div>" : "";

    // status chip in checkbox
    var chkCls = "chk";
    if (st === "done") chkCls += " done";
    else if (st === "skip") chkCls += " skip";

    // status buttons in expanded
    var sb = '<div class="status-row">';
    sb += '<button class="status-btn' + (st === "" ? " on-plan" : "") + '" onclick="event.stopPropagation();setStatusUI(\'' + t.id + '\',\'\')">מתוכנן</button>';
    sb += '<button class="status-btn' + (st === "done" ? " on-done" : "") + '" onclick="event.stopPropagation();setStatusUI(\'' + t.id + '\',\'done\')">בוצע</button>';
    sb += '<button class="status-btn' + (st === "skip" ? " on-skip" : "") + '" onclick="event.stopPropagation();setStatusUI(\'' + t.id + '\',\'skip\')">לא רלוונטי</button>';
    sb += '</div>';

    // appt block
    var apptTop;
    if (item.appt) {
      apptTop = '<div class="appt-top"><span class="appt-lbl">🗓 תור:</span>'
        + '<span class="appt-val">' + fmtDate(item.appt) + "</span>"
        + '<button class="appt-clear" onclick="event.stopPropagation();clearAppt(\'' + t.id + '\')">✕</button></div>';
    } else {
      apptTop = '<div class="appt-top"><span class="appt-lbl">🗓 קביעת תור:</span></div>';
    }
    var apptBlock = '<div class="appt-block" onclick="event.stopPropagation()">' + apptTop
      + '<input type="datetime-local" class="appt-input" id="ai-' + t.id + '"'
      + (item.appt ? ' value="' + item.appt + '"' : '')
      + ' onchange="apptChanged(\'' + t.id + '\',this.value)"></div>';

    var costSection = t.cost ? '<div class="meta-row"><div><div class="meta-lbl">עלות</div><div class="meta-val">' + t.cost + "</div></div></div>" : "";

    html += '<div class="' + cls + '" id="c-' + t.id + '">';
    html += '<div class="card-head" onclick="toggleCard(\'' + t.id + '\')">';
    html += '<div class="' + chkCls + '" onclick="event.stopPropagation();cycleStatusUI(\'' + t.id + '\')">';
    html += '<svg class="chk-done-ico" width="12" height="10" viewBox="0 0 12 10" fill="none"><path d="M1 5L4.5 8.5L11 1.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    html += '<span class="chk-skip-ico">✕</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="card-name">' + t.name + "</div>";
    html += '<div class="card-tags">' + tags + "</div>";
    html += '<div class="card-weeks">' + weeksLine + "</div>";
    html += drLine;
    html += apptMini;
    html += skipMini;
    html += "</div>";
    html += '<div class="card-chev">▼</div>';
    html += "</div>";
    html += '<div class="card-exp">';
    html += '<div class="card-det">' + t.det + "</div>";
    html += sb;
    html += apptBlock;
    html += costSection;
    html += "</div></div>";
  }

  html += "</div>";
  if (FOOT[activeTab]) html += '<div class="foot-note">' + FOOT[activeTab] + "</div>";
  document.getElementById("content").innerHTML = html;
}

function render() { renderTabs(); renderContent(); }
function switchTab(k) { activeTab = k; render(); window.scrollTo({top:0,behavior:"smooth"}); }
function toggleCard(id) { var c = document.getElementById("c-" + id); if (c) c.classList.toggle("open"); }

function cycleStatusUI(id) { cycleStatus(id); render(); }
function setStatusUI(id, status) {
  setStatus(id, status);
  render();
  setTimeout(function(){ var c=document.getElementById("c-"+id); if(c) c.classList.add("open"); }, 10);
}

function apptChanged(id, val) {
  setAppt(id, val);
  var mini = document.querySelector("#c-" + id + " .card-appt");
  if (!mini) {
    var body = document.querySelector("#c-" + id + " .card-body");
    if (body) { var d = document.createElement("div"); d.className = "card-appt"; body.appendChild(d); mini = d; }
  }
  if (mini) mini.textContent = val ? "🗓 תור: " + fmtDate(val) : "";
  var top = document.querySelector("#c-" + id + " .appt-top");
  if (top) {
    if (val) {
      top.innerHTML = '<span class="appt-lbl">🗓 תור:</span><span class="appt-val">' + fmtDate(val) + "</span>"
        + '<button class="appt-clear" onclick="event.stopPropagation();clearAppt(\'' + id + '\')">✕</button>';
    } else {
      top.innerHTML = '<span class="appt-lbl">🗓 קביעת תור:</span>';
    }
  }
}
function clearAppt(id) {
  setAppt(id, "");
  var el = document.getElementById("ai-" + id);
  if (el) el.value = "";
  apptChanged(id, "");
}

loadState();
activeTab = pickInitialTab();
render();
</script>
</body>
</html>
